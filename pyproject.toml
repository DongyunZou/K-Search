[project]
name = "k-search"
version = "0.1.0"
description = "LLM-driven GPU kernel optimization with a co-evolving world model."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cupti-python>=13.0.0",
    "flashinfer-bench>=0.1.2",
    "ipdb>=0.13.13",
    "ninja>=1.13.0",
    "omegaconf>=2.3.0",
    "openai>=2.30.0",
    "pyyaml>=6.0",
    "torch>=2.12.0",
    "wandb>=0.25.1",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-test-cu132"
url = "https://download.pytorch.org/whl/test/cu132"

[tool.uv.sources]
torch = [{ index = "pytorch-test-cu132" }]
triton = [{ index = "pytorch-test-cu132" }]
flashinfer-bench = { path = "/tmp/flashinfer-bench-main", editable = true }
